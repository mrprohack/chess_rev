name: reviewchess
description: ReviewChess Flutter Android client.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.2
  dio: ^5.9.0
  go_router: ^16.2.1
  shared_preferences: ^2.5.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  app_links: ^6.4.1
  flutter_svg: ^2.2.0
  just_audio: ^0.10.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/pieces/
    - assets/sounds/classic/
    - assets/sounds/soft/
    - assets/sounds/minimal/
    - test/fixtures/
